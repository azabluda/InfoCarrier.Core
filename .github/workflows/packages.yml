# Internal CI feed: pack every push and publish it to GitHub Packages.
#
# WHAT THIS IS FOR. A build of the current branch, installable, without waiting for a release.
# MinVer gives each commit a unique ordered prerelease — 10.0.1-alpha.0.7 — so a consumer can
# name the exact build they are testing against and NuGet orders them correctly.
#
# WHAT IT IS NOT. GitHub Packages is not a public feed: consuming a NuGet package from it needs a
# personal access token with `read:packages`, even when the package is public. That is a GitHub
# limitation, not a choice here, and it is why nuget.org remains the way anyone outside gets these
# packages. The compensating advantage is that a version here can be DELETED, which nuget.org
# never allows — exactly what an internal feed of throwaway builds needs.
#
# TO CONSUME IT:
#   dotnet nuget add source https://nuget.pkg.github.com/azabluda/index.json \
#     --name infocarrier-ci --username <you> --password <PAT with read:packages> --store-password-in-clear-text
#   dotnet add package InfoCarrier.Core --prerelease
#
# NO SECRET TO CONFIGURE. GITHUB_TOKEN is issued to the run and `packages: write` is enough.
name: Packages

on:
  push:
    # Release lines publish here too, and that is the point of an internal feed: a hotfix should
    # be installable BEFORE it is tagged, because a tag is irreversible on nuget.org and this is
    # the last place a candidate can be tried. MinVer numbers them off the release tag, so
    # `release/10.1` produces 10.1.1-alpha.0.N, which orders correctly against the 10.1.0 it
    # patches and against `main`'s 10.2.0-alpha line.
    branches: [main, 'release/**']
    paths-ignore:
      # A documentation change produces an identical assembly, so publishing a new version for one
      # would be noise on the feed. The site has its own workflow.
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Pack and publish to GitHub Packages
    runs-on: ubuntu-latest

    # TWO BRANCHES COUNTING FROM ONE TAG PRODUCE THE SAME VERSION, and until 2026-09-09 that was
    # impossible because only `main` published here. MinVer numbers a prerelease by HEIGHT above
    # the nearest tag, and `main` and `release/10.1` both count from `v10.1.0`, so each height the
    # release line reaches has usually been published by `main` already. The collision is not a
    # one-off either: after a hotfix ships and is merged up, BOTH branches count from the new tag
    # and start colliding again from height 1.
    #
    # A DIFFERENT PRERELEASE IDENTIFIER PER LINE IS THE FIX, and it is set as an environment
    # variable rather than a `-p:` on one step because MSBuild reads the environment as
    # properties, so `build` and `pack` cannot disagree about what the assembly and the package
    # say. `alpha` sorts below `hotfix`, and both sort below the release they precede.
    env:
      MinVerDefaultPreReleaseIdentifiers: ${{ github.ref == 'refs/heads/main' && 'alpha.0' || 'hotfix.0' }}

    steps:
      # Full history, because MinVer reads the version off the git tags. On a shallow clone every
      # build would publish the same default version and overwrite the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InfoCarrier.Core.slnx

      # An internal build still has to compile clean: CI=true makes warnings errors, exactly as
      # build.yml does. This feed is for builds someone might install, not for anything that
      # compiles.
      - name: Build
        env:
          CI: true
        run: dotnet build InfoCarrier.Core.slnx --no-restore --configuration Release

      - name: Pack
        run: >
          dotnet pack InfoCarrier.Core.slnx --no-build --configuration Release
          -p:ContinuousIntegrationBuild=true
          --output artifacts/pack

      - name: Show the version being published
        run: ls -1 artifacts/pack

      # A glob is safe HERE, unlike on nuget.org: GitHub Packages resolves a dependency within the
      # same feed, so the two packages may arrive in either order.
      #
      # `--skip-duplicate` WAS SET HERE AND IS DELIBERATELY GONE, 2026-09-09. Its stated reason was
      # that a re-run of the same commit publishes an identical version, which is true. What it
      # also did, once release lines began publishing, was turn a REAL collision into a warning
      # under a green tick: two branches at the same height produced the same version, the second
      # push answered `Conflict`, and the feed silently kept serving the FIRST branch's artifact
      # under that number. Both release-branch publishes on the day this was found did exactly
      # that, and the job reported success both times.
      #
      # The `env:` above removes the collision. What remains is the re-run case, and a red job is
      # the honest answer to it: the version is already published, so there is nothing to do and
      # something to know. A wrong artifact behind a green tick is the failure this repository
      # treats as worse than a broken build.
      - name: Push
        run: >
          dotnet nuget push "artifacts/pack/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
