name: Build & Test

on:
  push:
    # `main` is the only trunk. The v1 line lives on `release/3.1` and carries its own (AppVeyor)
    # build; a workflow that lives only on this branch cannot run on that one anyway, so naming
    # it here would be dead configuration.
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: InfoCarrier.Core.slnx
  TEST_PROJECT: test/InfoCarrier.Core.FunctionalTests/InfoCarrier.Core.FunctionalTests.csproj

  # Warnings are errors here and nowhere else. Directory.Build.props reads this, so a new warning
  # fails the build on the server while local development keeps them as warnings. GitHub Actions
  # already sets CI=true; it is stated explicitly so the gate is visible in the workflow rather
  # than depending on a runner's implicit environment. See docs/build-warnings.md.
  CI: true

jobs:
  # The documentation gates, which cost seconds and need no .NET.
  #
  # `mkdocs build --strict` in docs.yml checks that a linked PAGE exists. It does NOT check the
  # `#anchor` after it, so renaming a heading breaks every inbound link and the site build stays
  # green. Three links died that way once, one of them on the security path, which is what
  # eng/doc-links.py was written for. It lived only in a contributor's memory until this job.
  #
  # Here rather than in docs.yml because docs.yml is filtered to `website/**`, and doc-links.py
  # reads README.md, src/**/*.md and docs/**/*.md as well.
  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Links, including anchors
        run: python eng/doc-links.py

      - name: Prose word budgets
        run: python eng/doc-words.py --all --budget

  # Must be green. Build plus the two suites that are expected to pass unconditionally:
  # serializer round-trip and the end-to-end vertical slice.
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest

    steps:
      # Full history, because MinVer reads the version off the git tags and a shallow
      # clone has none. Without this the build still succeeds and silently produces a
      # default version, which is the failure mode worth spending one fetch to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test (round-trip + smoke)
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --filter "FullyQualifiedName~ExpressionRoundTripTest|FullyQualifiedName~InMemorySmokeTest"

      # Phase 1 of M8. A separate project on purpose: InfoCarrier.Core.FunctionalTests is what
      # the spec ratchet counts, and these are not spec tests.
      - name: Test (HTTP transport)
        run: >
          dotnet test test/InfoCarrier.Core.TransportTests/InfoCarrier.Core.TransportTests.csproj
          --no-build --configuration Release

      # Phase 2 of M8. Publishes the Blazor client trimmed and gates on the DIRECTION of this
      # product's IL2xxx count, not on zero — spec §9's "no warning attributable to
      # InfoCarrier.Core" is not met and eng/trim-baseline.txt records why. The script publishes
      # clean on purpose: an incremental publish does not re-run ILLink and would report zero.
      - name: Trim ratchet (Blazor publish)
        run: bash eng/trim-ratchet.sh

  # The inherited EFCore.Specification.Tests suite is legitimately red during build-out
  # (CLAUDE.md forbids skipping tests to force green), so this job gates on the *direction*
  # of the failure count, not its value. See roadmap.md §CI strategy.
  spec-ratchet:
    name: Spec ratchet
    runs-on: ubuntu-latest

    # Write access is for the `badges` branch only -- see the last step. Stated on the job rather
    # than the workflow so the fast gate keeps the read-only default. `checks: write` is for the
    # test report below, which creates a check run of its own.
    permissions:
      contents: write
      checks: write

    steps:
      # Full history, because MinVer reads the version off the git tags and a shallow
      # clone has none. Without this the build still succeeds and silently produces a
      # default version, which is the failure mode worth spending one fetch to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # Failures are the expected state here, so a non-zero exit must not end the job —
      # the ratchet step below is what decides. A crashed host is not exempted by this: it
      # reports *fewer* failures because fewer tests ran, and the ratchet catches that on the
      # total.
      #
      # ~15 minutes locally at 22312 tests, so allow generously rather than have a slow runner
      # look like a regression.
      - name: Test (full suite)
        continue-on-error: true
        timeout-minutes: 90
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Ratchet
        id: ratchet
        run: ./eng/ratchet.sh artifacts/test-results/results.trx test/known-failures.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results

      # Renders the TRX the ratchet just read as a browsable report, so the counts and the failing
      # tests are visible on the pull request without downloading the artifact. It creates a check
      # run named `Spec suite`; its title carries the three counters.
      #
      # THE RATCHET IS STILL THE GATE, and this step must never become one. `fail-on-error: true`
      # makes the check run red, which is what was asked for -- 9 tests really do fail -- but it
      # also calls setFailed, which would fail this job on every run and leave `ratchet.sh`'s exit
      # status meaning nothing. `continue-on-error: true` is what keeps those apart: the check run
      # is created and marked failed before setFailed is reached, and the job stays green.
      #
      # For the same reason `Spec suite` MUST NOT be added to branch protection's required checks.
      # It is red by design, and a required red check blocks every merge.
      #
      # `list-suites` and `list-tests` are not optional at this size. A check run's output is capped
      # at 65535 bytes and the action trims the listing at an arbitrary point above it, so at 22662
      # tests a full listing would always be cut. `failed` lists the failures and the classes that
      # own them, which is the part worth reading anyway.
      #
      # `fail-on-empty` is belt to eng/ratchet.sh's braces: the ratchet runs first and already exits
      # 1 on a missing TRX, which is the failure this job must not swallow. Here it only marks the
      # step, because continue-on-error covers this one.
      #
      # Skipped for a pull request from a fork, where the token is read-only and creating a check
      # run returns 403. On a push the expression is `null != true`, so pushes still run it. The
      # fix for forks is a second `workflow_run` workflow; it is not written because every pull
      # request here is from this repository, Dependabot's included.
      #
      # Pinned by commit SHA, unlike the actions/* above -- see .github/dependabot.yml, which notes
      # that the workflows pin by major version. This is the first third-party action here and the
      # exception is deliberate: a tag can be moved to point at other code, a commit SHA cannot.
      # Dependabot updates SHA pins the same way it updates tags.
      - name: Test report
        if: always() && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        with:
          name: Spec suite
          path: artifacts/test-results/results.trx
          reporter: dotnet-trx
          use-actions-summary: 'false'
          list-suites: 'failed'
          list-tests: 'failed'
          max-annotations: '50'
          fail-on-error: 'true'
          fail-on-empty: 'true'

      # Publishes the numbers the ratchet just read to the `badges` branch, where shields.io reads
      # them for README.md's spec-suite badge. The figures come from the counters file ratchet.sh
      # writes, so the TRX is parsed once and by one parser.
      #
      # `always()`, because a run that FAILS the ratchet still has numbers and the badge should
      # show them, in red. A badge frozen on the last green run is a badge that lies.
      #
      # AND NO SECRET. The usual recipe for this badge is a Gist plus a personal access token,
      # which would be the first long-lived credential in this repository -- release.yml is built
      # the way it is precisely to avoid having one. GITHUB_TOKEN can push, so it does. `badges`
      # is an orphan branch holding this one file and sharing no history with main; the step fails
      # loudly if that branch is missing rather than creating it, because a badge branch appearing
      # by accident is how a badge starts pointing at nothing.
      - name: Publish spec-suite badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLOR: ${{ steps.ratchet.outcome == 'success' && 'green' || 'red' }}
        run: |
          set -euo pipefail
          . artifacts/test-results/counters.env

          # 22658 -> 22,658. Five digits are hard to read in a badge without the separators.
          comma() { echo "$1" | sed -E ':a;s/([0-9])([0-9]{3})($|,)/\1,\2\3/;ta'; }

          work=$(mktemp -d)
          git clone --depth 1 --branch badges \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"

          printf '{"schemaVersion":1,"label":"spec suite","message":"%s / %s passing","color":"%s"}\n' \
            "$(comma "$passed")" "$(comma "$total")" "$COLOR" > "$work/spec-suite.json"

          cd "$work"
          git add spec-suite.json
          if git diff --staged --quiet; then
            echo "Badge unchanged; nothing to push."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Spec suite: ${passed} / ${total} passing"
          git push
