name: Build & Test

on:
  push:
    # `main` AND EVERY RELEASE LINE. A release branch carries hotfixes for a version people are
    # already running, so it needs the same gates the trunk does. Without them the first sign of
    # a broken patch is the release workflow failing on the tag, which is the worst moment to
    # find out: the fix is urgent by definition and the person applying it is under pressure.
    #
    # The v1 lines on `release/2.2` and `release/3.1` are unaffected. This workflow does not exist
    # on those branches, and a workflow is read from the branch being pushed, so naming them here
    # costs nothing and runs nothing.
    #
    # THE SPEC-SUITE BADGE STAYS `main`-ONLY, and its own step still says so. A badge is a claim
    # about the trunk; letting a release branch republish it would make the README describe
    # whichever branch happened to build last.
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: InfoCarrier.Core.slnx

  # THIS IS TIERS A TO C IN ONE PROJECT SINCE R136 — InMemory/, Sqlite/ and Firebird/. It is named
  # here rather than run through the solution because the solution also holds
  # InfoCarrier.Core.TransportTests, which is not a spec project and is gated by the fast job.
  #
  # ADR-009 Tier D is a project of its own, because MongoDB.EntityFrameworkCore needs a newer EF
  # Core patch than src/ compiles against and one project has one package graph, so the spec suite
  # is two test runs and eng/suite-summary.sh adds their counters.
  TEST_PROJECT: test/InfoCarrier.Core.FunctionalTests/InfoCarrier.Core.FunctionalTests.csproj

  # Warnings are errors here and nowhere else. Directory.Build.props reads this, so a new warning
  # fails the build on the server while local development keeps them as warnings. GitHub Actions
  # already sets CI=true; it is stated explicitly so the gate is visible in the workflow rather
  # than depending on a runner's implicit environment. See docs/build-warnings.md.
  CI: true

jobs:
  # The documentation gates, which cost seconds and need no .NET.
  #
  # `mkdocs build --strict` in docs.yml checks that a linked PAGE exists. It does NOT check the
  # `#anchor` after it, so renaming a heading breaks every inbound link and the site build stays
  # green. Three links died that way once, one of them on the security path, which is what
  # eng/doc-links.py was written for. It lived only in a contributor's memory until this job.
  #
  # Here rather than in docs.yml because docs.yml is filtered to `website/**`, and doc-links.py
  # reads README.md, src/**/*.md and docs/**/*.md as well.
  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Links, including anchors
        run: python eng/doc-links.py

      - name: Prose word budgets
        run: python eng/doc-words.py --all --budget

  # Must be green. Build plus the two suites that are expected to pass unconditionally:
  # serializer round-trip and the end-to-end vertical slice.
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest

    steps:
      # Full history, because MinVer reads the version off the git tags and a shallow
      # clone has none. Without this the build still succeeds and silently produces a
      # default version, which is the failure mode worth spending one fetch to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # THE PUBLIC-API GATE, and it belongs on the pull request rather than after the merge.
      # `dotnet pack` is what runs package validation: Directory.Build.props sets
      # EnablePackageValidation with a baseline of the published 10.0.0, so the SDK downloads that
      # package and compares assemblies. A break is reported as CP0002 and fails the pack.
      #
      # WRITTEN AFTER SIX SUCH BREAKS RODE A GREEN PULL REQUEST INTO `main` (#91, fixed in R119).
      # Every one was an optional parameter added to a public member -- source-compatible and
      # BINARY breaking, because the compiler emits one member and the old arity leaves the
      # assembly. `UseInfoCarrier` was among them, so a compiled consumer application would have
      # broken. Until this step existed, packages.yml was the only job that packed, and it runs on
      # `main` alone; the break was therefore invisible until it was already merged.
      #
      # Seconds, on top of a Release build that has already happened. Nothing is published: the
      # output goes to artifacts/pack and is not uploaded. packages.yml stays the only publisher.
      - name: Pack (public-API gate)
        run: >
          dotnet pack ${{ env.SOLUTION }} --no-build --configuration Release
          --output artifacts/pack

      - name: Test (round-trip + smoke)
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --filter "FullyQualifiedName~ExpressionRoundTripTest|FullyQualifiedName~InMemorySmokeTest"

      # The relational tier's own vertical slice, and the only place the raw-SQL seam is exercised
      # end to end.
      - name: Test (relational smoke)
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --filter "FullyQualifiedName~SqliteSmokeTest"

      # Phase 1 of M8. A separate project on purpose: InfoCarrier.Core.FunctionalTests is what
      # the spec-suite badge counts, and these are not spec tests.
      - name: Test (HTTP transport)
        run: >
          dotnet test test/InfoCarrier.Core.TransportTests/InfoCarrier.Core.TransportTests.csproj
          --no-build --configuration Release

      # ADR-009 TIER D RAN HERE UNTIL 2026-09-14 AND RUNS IN THE SPEC-SUITE JOB SINCE. It adopted
      # no specification bases when it sat here, so a bare `dotnet test` said everything there was
      # to say. It adopts six now, and they run with the rest of the spec suite.

      # Phase 2 of M8. Publishes the Blazor client trimmed and gates on the DIRECTION of this
      # product's IL2xxx count, not on zero — spec §9's "no warning attributable to
      # InfoCarrier.Core" is not met and eng/trim-baseline.txt records why. The script publishes
      # clean on purpose: an incremental publish does not re-run ILLink and would report zero.
      - name: Trim ratchet (Blazor publish)
        run: bash eng/trim-ratchet.sh

  # THE SPEC SUITE, GREEN, AND `dotnet test`'S OWN EXIT CODE IS THE GATE (2026-09-15). Until then
  # the suite was red on purpose and this job gated on the DIRECTION of the failure count against
  # test/known-failures.txt. Now every override of a specification test says what the store does and
  # where that is shown, and OverrideAudit, a test inside each project, fails the run on one that
  # does not (docs/plans/v10/test-overhaul.md). So a red test fails the step, and a crashed test
  # host does too, which was the other thing the ratchet's total guarded.
  #
  # `Spec tests` IS A REQUIRED CHECK IN THE `main` RULESET, BY THIS EXACT NAME. It was `Spec ratchet`
  # until 2026-09-15 and was renamed here and in the ruleset together; a job renamed alone leaves
  # every pull request waiting for a check that never reports. Not `Spec suite`, which is the name of
  # the report's check run below.
  spec-tests:
    name: Spec tests
    runs-on: ubuntu-latest

    # Write access is for the `badges` branch only -- see the last step. Stated on the job rather
    # than the workflow so the fast gate keeps the read-only default. `checks: write` is for the
    # test report below, which creates a check run of its own.
    permissions:
      contents: write
      checks: write

    steps:
      # Full history, because MinVer reads the version off the git tags and a shallow
      # clone has none. Without this the build still succeeds and silently produces a
      # default version, which is the failure mode worth spending one fetch to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # Named explicitly and not run through the solution: the solution also holds
      # InfoCarrier.Core.TransportTests, which is not part of this number.
      #
      # INFOCARRIER_OVERRIDE_REASONS makes OverrideAuditTest write the reason of every override beside
      # the TRX, which eng/suite-summary.sh joins with the results for the EF parity badge.
      - name: Test (full suite, Tiers A-C)
        id: tiers-a-c
        timeout-minutes: 90
        env:
          INFOCARRIER_OVERRIDE_REASONS: ${{ github.workspace }}/artifacts/test-results
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      # ADR-009 Tier D. It starts a real mongod per test class from binaries Mongo2Go carries in its
      # own package. Nothing is downloaded and no container is used, which is the bar ADR-009 set
      # when it chose Firebird over PostgreSQL.
      #
      # `success() || failure()` so that a red in Tiers A-C does not hide whether Tier D is red too;
      # a cancelled run still stops here.
      - name: Test (document store, Tier D)
        id: tier-d
        if: success() || failure()
        timeout-minutes: 30
        env:
          INFOCARRIER_OVERRIDE_REASONS: ${{ github.workspace }}/artifacts/test-results
        run: >
          dotnet test test/InfoCarrier.Core.DocumentStoreTests/InfoCarrier.Core.DocumentStoreTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=tierd.trx" --results-directory artifacts/test-results

      # Reports and decides nothing: EF parity for the badge, and the counters and the failing names
      # for the run summary. `always()`, because a red run still has numbers worth publishing.
      - name: Summary
        if: always()
        run: >
          ./eng/suite-summary.sh
          artifacts/test-results/results.trx
          artifacts/test-results/tierd.trx

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results

      # Renders the TRX as a browsable report, so the counts and the failing tests are visible on
      # the pull request without downloading the artifact. It creates a check run named
      # `Spec suite`; its title carries the three counters.
      #
      # THE TEST STEPS ARE THE GATE. This step reports and never gates, and `fail-on-error: false`
      # keeps its check run green whatever it finds, so there is one verdict and not two.
      #
      # THIS WAS RED FOR EXACTLY ONE PULL REQUEST, on purpose, and reversed the same day. A pull
      # request LIST shows one icon per row, the rollup of every check, and it takes the worst one.
      # So #57 sat above forty green ticks wearing a red cross that meant "nine tests fail, as they
      # have since M2". Every later pull request, Dependabot's included, would have worn the same
      # one. That is the check-blindness this comment used to warn about, arriving through the door
      # it was watching.
      #
      # `continue-on-error` stays, for the other reason: a 403, a missing artifact or a bad parse
      # is a reporting problem, and a reporting problem must not fail a build whose tests ran.
      #
      # `Spec suite` MUST NOT be added to branch protection's required checks. It is now green
      # unconditionally, so requiring it would require nothing at all.
      #
      # `list-suites` and `list-tests` are not optional at this size. A check run's output is capped
      # at 65535 bytes and the action trims the listing at an arbitrary point above it, so at 22662
      # tests a full listing would always be cut. `failed` lists the failures and the classes that
      # own them, which is the part worth reading anyway.
      #
      # `fail-on-empty` marks a missing TRX. Here it only marks the step, because continue-on-error
      # covers this one; a test step that produced no TRX has already failed the job.
      #
      # Skipped for a pull request from a fork, where the token is read-only and creating a check
      # run returns 403. On a push the expression is `null != true`, so pushes still run it. The
      # fix for forks is a second `workflow_run` workflow; it is not written because every pull
      # request here is from this repository, Dependabot's included.
      #
      # Pinned by commit SHA, unlike the actions/* above -- see .github/dependabot.yml, which notes
      # that the workflows pin by major version. This is the first third-party action here and the
      # exception is deliberate: a tag can be moved to point at other code, a commit SHA cannot.
      # Dependabot updates SHA pins the same way it updates tags.
      - name: Test report
        if: always() && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
        with:
          name: Spec suite
          path: artifacts/test-results/results.trx
          reporter: dotnet-trx
          use-actions-summary: 'false'
          list-suites: 'failed'
          list-tests: 'failed'

          # `49` AND NOT `50`, WHICH IS THE ACTION'S OWN DOCUMENTED MAXIMUM. `get-annotations.ts` trims
          # with `errors.splice(maxCount + 1)`, and `splice(start)` deletes from `start` onward, so it
          # KEEPS `maxCount + 1` items. At 50 it posts 51, and `checks.update` caps `output.annotations`
          # at 50 and rejects the call with `No more than 50 items are allowed; 51 were supplied`.
          #
          # The check run is created before that call and completed by it, so the rejection leaves
          # `Spec suite` `in_progress` FOREVER: a permanently yellow row that no later run can finish,
          # because a check run belongs to one commit. `continue-on-error` below hides it, which is why
          # the job (then `Spec ratchet`) still reported pass while the report it produces had silently stopped
          # existing.
          #
          # Invisible until the suite passed 51 failing tests, because the annotation count IS the
          # failing-test count and `splice(51)` does nothing to a shorter array. Main sat at 9 for
          # months and reached 116 in one push (#56), which is when it first fired.
          max-annotations: '49'
          fail-on-error: 'false'
          fail-on-empty: 'true'

      # Publishes EF parity to the `badges` branch, where shields.io reads it for README.md's
      # spec-suite badge. The figures come from the counters file eng/suite-summary.sh writes, so
      # the TRX is parsed once and by one parser.
      #
      # THE BADGE SHOWED "passed / total passing" UNTIL 2026-09-15. The suite went green that day,
      # which made that figure a constant. It shows EF parity now, eng/spec-parity.py's share of the
      # test cases that ran through InfoCarrier on which it behaves as EF's own provider, and the
      # colour carries the rest: red when a test step failed, yellow while an InfoCarrier defect is
      # tracked by an [InfoCarrierDefect] override, green otherwise (the owner's decision, the same
      # day; docs/plans/v10/test-overhaul.md). The file keeps its name, so README.md is unchanged.
      #
      # `always()`, because a red run still has numbers and the badge should show them, in red. A
      # badge frozen on the last green run is a badge that lies.
      #
      # AND NO SECRET. The usual recipe for this badge is a Gist plus a personal access token,
      # which would be the first long-lived credential in this repository -- release.yml is built
      # the way it is precisely to avoid having one. GITHUB_TOKEN can push, so it does. `badges`
      # is an orphan branch holding this one file and sharing no history with main; the step fails
      # loudly if that branch is missing rather than creating it, because a badge branch appearing
      # by accident is how a badge starts pointing at nothing.
      - name: Publish spec-suite badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS_PASSED: ${{ steps.tiers-a-c.outcome == 'success' && steps.tier-d.outcome == 'success' }}
        run: |
          set -euo pipefail
          . artifacts/test-results/counters.env

          if [ "$TESTS_PASSED" != "true" ]; then
            COLOR=red
          elif [ "$infocarrier_defects" -gt 0 ]; then
            COLOR=yellow
          else
            COLOR=green
          fi

          work=$(mktemp -d)
          git clone --depth 1 --branch badges \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"

          # RETRIED, BECAUSE TWO PUSHES TO `main` MINUTES APART RACE FOR THIS BRANCH. On
          # 2026-09-10 two runs reached here 55 seconds apart; the first won and the second was
          # rejected with `cannot lock ref 'refs/heads/badges'`. Every gate in that run had
          # passed and the badge already held the right numbers, so the only casualty was a red
          # X on a green commit, which is the kind of failure that teaches people to ignore red.
          #
          # LAST WRITER WINS ON PURPOSE. Each attempt rewrites the file from THIS run's counters
          # before committing, so whichever run finishes last leaves its own numbers. That is the
          # same rule a single writer would follow, and it keeps the badge honest about the most
          # recent measurement rather than the most recent push attempt.
          for attempt in 1 2 3; do
            printf '{"schemaVersion":1,"label":"EF parity","message":"%s%%","color":"%s"}\n' \
              "$parity" "$COLOR" > spec-suite.json

            git add spec-suite.json
            if git diff --staged --quiet; then
              echo "Badge unchanged; nothing to push."
              exit 0
            fi

            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "EF parity: ${parity}% (${parity_infocarrier} of ${parity_ran} cases differ)"

            if git push; then
              exit 0
            fi

            echo "::notice::The badges branch moved under this push; retrying ($attempt of 3)."
            git fetch origin badges
            git reset --hard FETCH_HEAD
          done

          echo "::error::Could not publish the spec-suite badge after three attempts."
          exit 1
