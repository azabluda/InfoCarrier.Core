# Release: pack on a tag, gate it, attach the packages to a GitHub Release, then wait for a human
# before touching nuget.org.
#
# NOTHING REACHES NUGET.ORG WITHOUT AN APPROVAL. A pushed NuGet version is immutable: it can be
# deprecated or unlisted, never truly withdrawn, so a person decides. That was M8-20's rule and it
# still holds — what changed is where the person stands. They used to run `dotnet nuget push` from
# their own machine with their own key; they now approve a protected environment, and the workflow
# pushes. Same gate, but the step is repeatable and the push is recorded against the run.
#
# AND THERE IS NO PUBLISHING SECRET ANYWHERE IN THIS REPOSITORY. Publishing uses nuget.org's
# TRUSTED PUBLISHING: the job proves its identity with a GitHub OIDC token, nuget.org validates it
# against a policy naming this owner, this repository, this workflow file and this environment, and
# returns an API key valid for ONE HOUR. Nothing long-lived is stored, so nothing long-lived can
# leak. nuget.org's own guidance now calls API keys "strongly discouraged" for automation.
# See the `publish-nuget` job for the one-time setup.
#
# THE VERSION IS THE TAG. MinVer derives it (Directory.Build.props), which is why this workflow no
# longer compares the two and why `fetch-depth: 0` below is load-bearing rather than tidy.
#
# ORDER MATTERS: InfoCarrier.Core first, then InfoCarrier.Core.AspNetCore, which declares a
# dependency on it at the same version — nuget.org rejects a package whose dependency does not
# resolve. (Before M8-22 the order was the other way round, because Abstractions was its own
# package; it is now merged into InfoCarrier.Core.)
name: Release

on:
  push:
    tags: ['v*']
  # So a release build can be rehearsed without creating a tag. Produces the same artifacts and
  # skips the GitHub Release step.
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: InfoCarrier.Core.slnx
  TEST_PROJECT: test/InfoCarrier.Core.FunctionalTests/InfoCarrier.Core.FunctionalTests.csproj

jobs:
  release:
    name: Pack and release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the Release

    steps:
      # Full history: SourceLink stamps the commit into the package, and a shallow clone gives
      # it nothing to stamp.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # The same two gates build.yml runs, because a release must clear at least what a push
      # clears. The spec suite is legitimately red (CLAUDE.md forbids skipping to force green),
      # so the ratchet decides, not the exit code.
      - name: Test (round-trip + smoke)
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --filter "FullyQualifiedName~ExpressionRoundTripTest|FullyQualifiedName~InMemorySmokeTest"

      - name: Test (HTTP transport)
        run: >
          dotnet test test/InfoCarrier.Core.TransportTests/InfoCarrier.Core.TransportTests.csproj
          --no-build --configuration Release

      - name: Test (full suite)
        continue-on-error: true
        timeout-minutes: 90
        run: >
          dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release
          --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Spec ratchet
        run: ./eng/ratchet.sh artifacts/test-results/results.trx test/known-failures.txt

      - name: Trim ratchet (Blazor publish)
        run: bash eng/trim-ratchet.sh

      # ContinuousIntegrationBuild makes the build deterministic and normalises the source paths
      # SourceLink embeds. Only set here, never locally, which is what the property is for.
      - name: Pack
        run: >
          dotnet pack ${{ env.SOLUTION }} --no-build --configuration Release
          -p:ContinuousIntegrationBuild=true
          --output artifacts/pack

      # THERE IS NOTHING LEFT TO VERIFY, and that is the improvement. This step used to compare
      # the tag against a version in Directory.Build.props, because the two were separate and
      # could disagree. MinVer derives the version FROM the tag, so they cannot.
      #
      # The step is not merely redundant, it was broken: `ls InfoCarrier.Core.*.nupkg | grep -v
      # Abstractions` was written when InfoCarrier.Core.Abstractions existed. M8-22 merged that
      # away and added InfoCarrier.Core.AspNetCore, which the same glob matches and the grep does
      # not exclude — so `pkg` held two lines and every tagged release would have failed here.
      # Confirmed by packing both products and running the step's own shell against them.
      #
      # What replaced it is a check the old one could not make: that both expected files exist,
      # under the exact names the push step will use.
      - name: Verify the packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for id in InfoCarrier.Core InfoCarrier.Core.AspNetCore; do
            for ext in nupkg snupkg; do
              file="artifacts/pack/$id.$version.$ext"
              if [ -f "$file" ]; then
                echo "ok      $file"
              else
                echo "::error::Expected $file, which was not produced. MinVer derives the version from the tag, so a mismatch here means the tag is not what was built — check that the workflow checked out with fetch-depth 0."
                missing=1
              fi
            done
          done
          exit $missing

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/pack/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pack/*.nupkg
            artifacts/pack/*.snupkg
          generate_release_notes: true
          # A pre-release tag marks the Release as a pre-release, so the repository's landing
          # page does not advertise it as the current version.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Packages are attached, and the `publish-nuget` job of this run is **waiting for a
            reviewer**. Nothing reaches nuget.org until somebody approves it, because a pushed
            version can be unlisted but never withdrawn.

            Approve it and it pushes both packages, `InfoCarrier.Core` first — the second
            declares a dependency on it at the same version, and nuget.org rejects a package whose
            dependency does not resolve.

            Publishing uses **Trusted Publishing**: the job exchanges a GitHub OIDC token for an
            API key valid for one hour. No publishing secret is stored in this repository.

            Known limitations for this release: [`docs/limitations.md`](docs/limitations.md).

  # ------------------------------------------------------------------------------------------
  # The irreversible step, and the only one in this repository that needs a human.
  #
  # M8-20 kept nuget.org publishing off CI entirely, and its reasoning was right: a pushed NuGet
  # version can be unlisted but never withdrawn, so a person must decide. What it bought that
  # reasoning with was a key on somebody's laptop and a step nobody could repeat. A protected
  # ENVIRONMENT keeps the decision and drops the price: the job below does not start until a
  # required reviewer approves it, the key is an environment secret rather than a personal one,
  # and every push is recorded against the run that made it. Dated note in docs/plans/v10/roadmap.md.
  #
  # ONE-TIME SETUP, in two halves. BOTH ARE REQUIRED and each fails closed on its own.
  #
  #   1. GitHub: Settings -> Environments -> `nuget-org` -> tick "Required reviewers", name at
  #      least one, and SAVE. Ticking without saving leaves `protection_rules: []`, and then a
  #      tag publishes with nobody in the loop — which is the one thing this job exists to
  #      prevent.
  #
  #   2. nuget.org: your username -> Trusted Publishing -> create a policy with
  #        Repository Owner : azabluda
  #        Repository       : InfoCarrier.Core
  #        Workflow File    : release.yml      (file name only, no .github/workflows/ prefix)
  #        Environment      : nuget-org        (optional, and worth setting: it pins the policy
  #                                             to the approval-gated job rather than to any job
  #                                             in this workflow)
  #      The policy applies to every package owned by that account, so neither package has to
  #      exist on nuget.org first — which matters here, because neither does.
  #
  # A NEW POLICY ON A PRIVATE REPOSITORY IS "PENDING" FOR 7 DAYS and goes inactive if nothing is
  # published in that window; the first successful publish makes it permanent. This repository is
  # public, so it should be active immediately — but check the status in the UI if a push is
  # refused.
  #
  # WHY OIDC RATHER THAN A STORED KEY. The token is minted per run, is good for one exchange, and
  # yields an API key valid for one hour. There is no secret to rotate, to leak, or to forget on a
  # laptop. Request it immediately before the push, as below: asking early and pushing late is the
  # documented way to have it expire under you.
  # ------------------------------------------------------------------------------------------
  publish-nuget:
    name: Publish to nuget.org
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment:
      name: nuget-org
      url: https://www.nuget.org/packages/InfoCarrier.Core

    # `id-token: write` is what lets this job ask GitHub for the OIDC token nuget.org validates.
    # Without it the login step fails with a token-issuance error rather than an auth error, which
    # is worth knowing before diagnosing the wrong end.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/pack

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # THE CREDENTIAL IS MINTED HERE, ONE STEP BEFORE IT IS USED. nuget.org exchanges this
      # job's OIDC token for an API key valid for ONE HOUR, and each token buys exactly one key.
      # Requesting it early and pushing late is the documented way to have it expire mid-release,
      # so this sits immediately above the pushes and nowhere else.
      #
      # `user` is the nuget.org PROFILE NAME, not an email address. It is not a secret — it is
      # already visible on every package page — so it is written plainly rather than hidden in a
      # secret that would only make the failure harder to read.
      - name: Exchange the OIDC token for a short-lived key
        id: login
        uses: NuGet/login@v1
        with:
          user: azabluda

      # ORDER MATTERS, and it is why this is two steps rather than a glob over the folder.
      # InfoCarrier.Core.AspNetCore declares a dependency on InfoCarrier.Core at the same
      # version, and nuget.org rejects a package whose dependency does not resolve.
      #
      # EXACT FILENAMES, not globs: `InfoCarrier.Core.*.nupkg` also matches
      # InfoCarrier.Core.AspNetCore. A stale filter of exactly that shape is what broke the old
      # version gate, so the lesson is spent here rather than learned twice.
      - name: Push InfoCarrier.Core
        run: >
          dotnet nuget push "artifacts/pack/InfoCarrier.Core.${GITHUB_REF_NAME#v}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      - name: Push InfoCarrier.Core.AspNetCore
        run: >
          dotnet nuget push "artifacts/pack/InfoCarrier.Core.AspNetCore.${GITHUB_REF_NAME#v}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      # THERE IS NO SEPARATE SYMBOLS STEP, and there used to be. `dotnet nuget push` uploads the
      # matching `.snupkg` by itself when it sits beside the `.nupkg`, which both pushes above do
      # -- the run log shows four uploads from two commands:
      #
      #     Pushing InfoCarrier.Core.10.0.0-preview.1.nupkg  ... Your package was pushed.
      #     Pushing InfoCarrier.Core.10.0.0-preview.1.snupkg ... Your package was pushed.
      #
      # A third step pushing the .snupkg files again earned a 409 from nuget.org ("another copy of
      # this symbols package pending validation") on the very first real release. It was
      # `continue-on-error`, so nothing broke -- it just printed a red annotation on an otherwise
      # clean release, which is the kind of noise that teaches people to ignore annotations.
