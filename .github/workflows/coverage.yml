name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '11.0.x'
  SOLUTION: InfoCarrier.Core.slnx

jobs:
  coverage-tests:
    name: Coverage tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, cosmos]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      # Each matrix entry has its own machine and output directory.
      - name: Test functional suite with coverage
        if: matrix.suite == 'functional'
        run: dotnet test test/InfoCarrier.Core.FunctionalTests/InfoCarrier.Core.FunctionalTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings eng/coverage.runsettings --results-directory artifacts/coverage/raw

      - name: Start Cosmos emulator (Docker)
        if: matrix.suite == 'cosmos'
        run: dotnet run --file eng/CosmosEmulator.cs -- start docker
      - name: Test document and transport suites with coverage
        if: matrix.suite == 'cosmos'
        run: |
          dotnet test test/InfoCarrier.Core.CosmosTests/InfoCarrier.Core.CosmosTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings eng/coverage.runsettings --results-directory artifacts/coverage/raw
          dotnet test test/InfoCarrier.Core.TransportTests/InfoCarrier.Core.TransportTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings eng/coverage.runsettings --results-directory artifacts/coverage/raw
          dotnet test test/InfoCarrier.EngineeringTests/InfoCarrier.EngineeringTests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings eng/coverage.runsettings --results-directory artifacts/coverage/raw
      - name: Cosmos failure logs
        if: failure() && matrix.suite == 'cosmos'
        run: dotnet run --file eng/CosmosEmulator.cs -- logs docker
      - name: Stop Cosmos emulator
        if: always() && matrix.suite == 'cosmos'
        run: dotnet run --file eng/CosmosEmulator.cs -- stop docker
      - name: Upload raw coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-raw-${{ matrix.suite }}
          path: artifacts/coverage/raw
          if-no-files-found: error

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: coverage-tests
    if: always()
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore report tools
        run: dotnet tool restore
      - name: Download raw coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-raw-*
          merge-multiple: true
          path: artifacts/coverage/raw
      - name: Require successful coverage jobs
        run: >
          dotnet run --file eng/RequireSuccessfulJobs.cs --
          "coverage=${{ needs.coverage-tests.result }}"

      - name: Merge and render coverage
        run: |
          mkdir -p artifacts/coverage/report
          dotnet coverage merge \
            "artifacts/coverage/raw/**/coverage.cobertura.xml" \
            --output artifacts/coverage/report/merged.cobertura.xml \
            --output-format cobertura
          dotnet reportgenerator \
            "-reports:artifacts/coverage/report/merged.cobertura.xml" \
            "-targetdir:artifacts/coverage/report" \
            "-reporttypes:Html;MarkdownSummaryGithub"

      - name: Publish summary
        run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        id: report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/report

      # Fork tokens cannot write comments. The summary and downloadable report remain available.
      - name: Review coverage with octocov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278  # v1
        with:
          version: v0.83.3
          checksum: 8d6576580d151e785474f193d740f63cb91b70ac767d402410fcd7f187a34202
        env:
          COVERAGE_REPORT_URL: ${{ steps.report.outputs.artifact-url }}
