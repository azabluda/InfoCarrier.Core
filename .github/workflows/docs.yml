# The documentation site: build it on every push, publish it to GitHub Pages.
#
# SEPARATE FROM build.yml ON PURPOSE. That workflow's `CI: true` makes compiler warnings fatal and
# its spec-ratchet job takes up to ninety minutes; neither has anything to say about Markdown, and
# a documentation typo must not queue behind a 22,000-test suite. Nothing here touches the
# solution, the ratchets or the baselines.
#
# ONE-TIME SETUP, and this workflow cannot do it for you. TWO settings, and the second is the one
# that is easy to miss because it only bites once the site stops publishing from the default
# branch:
#
#   1. Settings -> Pages, set Source to "GitHub Actions". Until that is done the `deploy` job fails
#      on `configure-pages` while `build` keeps passing, which is the right way round -- the
#      content is still verified.
#
#   2. Settings -> Environments -> github-pages -> Deployment branches: ADD `release/*`. Enabling
#      Pages creates that environment with a policy naming the default branch and nothing else, so
#      the first deploy from a release branch is rejected before it runs a step:
#      `Branch "release/10.1" is not allowed to deploy to github-pages due to environment
#      protection rules.` The build still passes, so the failure is a red `deploy` job and a site
#      that silently stops updating. Measured on 2026-09-09, the day the site moved off `main`.
#
# THE GATE IS `--strict`. A link to a page that does not exist, or a page missing from the nav,
# fails the build. That is the only automated check a documentation site has, so it runs on pull
# requests too, where nothing is deployed.
name: Docs

# THE SITE PUBLISHES FROM THE CURRENT RELEASE LINE, NOT FROM `main`, AND THAT IS THE WHOLE POINT
# OF THIS BLOCK. `main` runs ahead of what is on nuget.org: the moment a feature lands there, an
# unversioned site built from `main` starts telling every reader to call an API their package does
# not contain. It happened -- 10.1.0 readers were shown a server-side transaction timeout that
# ships in 10.2.0, and a sentence true of their version was deleted for being false on `main`.
#
# So `main` BUILDS and does not DEPLOY, which keeps `--strict` as a gate on every pull request,
# and the release branch is what the world sees. A documentation fix for the shipped release is
# therefore a change on `release/10.1`, which is where such a fix belongs anyway; it reaches `main`
# when the branch is merged up.
#
# PUBLISHING IS AN EXPLICIT ACT. A push to a release branch BUILDS and does not deploy: the site
# changes when a human runs this workflow and not as a side effect of committing. So a stale site
# is possible, and that is the accepted trade -- a documentation fix reaches readers when it is
# ready rather than when it is typed, and publishing the wrong thing takes a decision.
#
# NOTHING HERE NAMES A VERSION, which is deliberate. The branch you dispatch from IS the choice of
# what to publish, so a new minor needs no edit to this file: cut `release/10.2` and dispatch on
# it. Dispatching on an older line republishes that line's docs over the site, which is a real way
# to get this wrong and is now a thing somebody chose rather than a thing a push did.
on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  # THE ONLY EVENT THAT PUBLISHES. Run it from the Actions tab, or `gh workflow run Docs --ref
  # release/10.1`. A dispatch from `main` still builds and deploys nothing, because `main` runs
  # ahead of what is on nuget.org.
  workflow_dispatch:

# Read the repository; write Pages and the OIDC token deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` because cancelling a half-finished
# deployment is worse than waiting for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt

      # Pinned in the requirements file, so a fresh runner builds the same site as a local machine.
      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict --config-file website/mkdocs.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: Deploy
    # ONLY a manual dispatch, and only from a release line. The first half is what makes
    # publishing explicit; the second is what keeps `main`, which runs ahead of nuget.org, off the
    # site even when somebody dispatches it there by mistake. A pull request cannot reach either
    # condition, so a fork's branch still cannot publish.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
