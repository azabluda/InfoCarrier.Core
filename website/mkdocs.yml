# The public documentation site: https://azabluda.github.io/InfoCarrier.Core/
#
# WRITTEN FOR SOMEONE OUTSIDE THIS REPOSITORY. Nothing here cites an ADR, a milestone, a phase or
# a test tier; `docs/` is where those live and it is deliberately not this site's source. Two
# audiences, two sets of files, and mixing them is what makes internal documents read as promises.
#
# Build it locally the way CI does:
#     dotnet run --file eng/DocsServe.cs -- --build
# The wrapper installs MkDocs in .venv when needed; MkDocs requires its Python runtime.
#
# `--strict` is not optional: it turns a broken internal link or a page missing from the nav into
# a failed build, which is the only automated check a documentation site can have.

site_name: InfoCarrier.Core
site_description: >-
  Entity Framework Core in a client application that has no database. LINQ, change tracking and
  transactions on the client; the real database stays on your server.
site_url: https://azabluda.github.io/InfoCarrier.Core/
site_author: Alexander Zabluda
copyright: MIT licensed. Copyright &copy; Alexander Zabluda.

repo_url: https://github.com/azabluda/InfoCarrier.Core
repo_name: azabluda/InfoCarrier.Core

# `main` is the trunk. An `edit_uri` naming the wrong branch produces a 404 on every page, which
# is worse than no edit link — so it is worth re-checking whenever the branch layout moves.
edit_uri: edit/main/website/docs/

theme:
  name: material
  language: en
  # `overrides/` adds the two icon links base.html has no setting for -- the apple-touch icon and
  # the manifest. See website/overrides/main.html for why neither can be expressed here.
  custom_dir: overrides
  # A three-frame .ico (16/32/48), which is the whole favicon story: one request, and the tab, the
  # bookmark bar and a pinned taskbar tile each get pixels rendered for their size. Separate
  # 16/32/48 PNGs alongside it would be three more `<link>` tags for pixels this file already has.
  # Generate icons with `dotnet run --file eng/MakeIcons.cs`; do not edit the outputs by hand.
  favicon: assets/icons/favicon.ico
  # NO `logo:`, AND THAT IS DELIBERATE -- the mark belongs on the tab, not in the header. Material
  # does not fall back to the favicon when this is absent: it draws its own `material/library`
  # glyph, a generic book, which is what the header shows and is what is wanted here.
  # System fonts rather than the theme's default Google Fonts. The default fetches Roboto from
  # fonts.googleapis.com on every page view, which sends every visitor's IP to a third party for
  # a typeface. Setting this to `false` makes the built site self-contained: the only things it
  # loads are its own bundle and, on a page with a diagram, the Mermaid that ships inside it.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    # Without these two, `edit_uri` above is INERT — Material renders no control at all, so the
    # setting silently does nothing however carefully it is pointed at the right branch.
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
  palette:
    # The default follows the reader's system setting; the toggles override it.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  # Mermaid ships with the theme; no diagram fetches anything at page load.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/documentation.css

extra:
  development_docs: true

plugins:
  - search

nav:
